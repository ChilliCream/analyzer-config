name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'      # stable, e.g. 1.0.0
      - '[0-9]+.[0-9]+.[0-9]+-*'    # prerelease, e.g. 1.0.0-p.1

env:
  ARTIFACTS_PATH: 'artifacts/packages'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # required for OIDC (NuGet trusted publishing)
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack NuGet package
        run: |
          dotnet pack src/Libraries/Libraries.csproj \
            --configuration Release \
            --output ${{ env.ARTIFACTS_PATH }} \
            -p:PackageVersion=${{ github.ref_name }}

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, NOT email

      - name: Publish to NuGet
        run: |
          dotnet nuget push "${{ env.ARTIFACTS_PATH }}/*.nupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
