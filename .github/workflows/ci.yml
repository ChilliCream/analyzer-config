name: CI

on:
  pull_request:

jobs:
  spellcheck:
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install cspell
        run: npm install --global cspell@10.4.0

      - name: Check spelling
        run: git ls-files | cspell --no-progress --file-list stdin

  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: |
          dotnet build AnalyzerConfig.slnx \
            --configuration Release

      - name: Test
        run: |
          dotnet test \
            --solution AnalyzerConfig.slnx \
            --configuration Release \
            --no-build
